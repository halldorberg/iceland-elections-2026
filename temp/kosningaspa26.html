<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ríkisstjórnarspá Reykjavík 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --surface: #f4f5f7;
    --border: #dde1e7;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #1a3a6b;
    --empty-text: #b0b7c3;
    --btn-bg: #f4f5f7;
    --btn-letter: #4a5568;
    --btn-name: #6b7280;
    --shadow: rgba(0,0,0,0.08);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --surface: #1c1f27;
      --border: #2e3340;
      --text: #e8eaf0;
      --muted: #9ca3af;
      --accent: #7baaf7;
      --empty-text: #4b5563;
      --btn-bg: #22262f;
      --btn-letter: #d4d8e2;
      --btn-name: #9ca3af;
      --shadow: rgba(0,0,0,0.4);
    }
    .verdict-high   { background: #14532d; color: #86efac; }
    .verdict-medium { background: #78350f; color: #fcd34d; }
    .verdict-low    { background: #7f1d1d; color: #fca5a5; }
    .verdict-none   { background: #1e2330; color: #94a3b8; }
    /* Active button glow in dark mode */
    .party-btn.active { box-shadow: 0 0 0 1px var(--party-color, var(--accent)), 0 2px 12px color-mix(in srgb, var(--party-color, var(--accent)) 30%, transparent); }
    /* More visible trend chart grid */
    .trend-chart line { stroke-opacity: 0.18 !important; }
    /* Trend label brighter */
    .trend-label { color: var(--text) !important; opacity: 0.5; }
    /* Header accent line */
    .header-label { color: var(--accent); opacity: 0.9; }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 0;
    margin: 0;
  }

  .widget {
    width: 100%;
    max-width: 680px;
  }

  .header {
    margin-bottom: 1.5rem;
  }

  .header h1 {
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }

  .header p {
    font-size: 0.875rem;
    color: var(--muted);
    font-weight: 400;
    line-height: 1.6;
  }

  .parties-grid {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: 0.35rem;
    margin-bottom: 1rem;
  }

  .party-btn {
    background: var(--btn-bg);
    border: 1.5px solid var(--border);
    border-radius: 5px;
    color: var(--btn-letter);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 600;
    padding: 0.45rem 0.15rem 0.35rem;
    text-align: center;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
  }

  .party-btn .letter { font-size: 0.95rem; font-weight: 700; position: relative; z-index: 1; color: var(--btn-letter); pointer-events: none; }
  .party-btn .name { font-size: 0.42rem; font-family: var(--sans); font-weight: 400; color: var(--btn-name); letter-spacing: 0; position: relative; z-index: 1; line-height: 1.25; text-align: center; pointer-events: none; word-break: break-word; }

  .party-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--party-color, var(--accent));
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
  }

  .party-btn:hover { border-color: var(--party-color, var(--accent)); box-shadow: 0 1px 4px var(--shadow); }
  .party-btn:hover::before { opacity: 0.1; }
  .party-btn:hover .name { color: var(--text); }

  .party-btn.active { border-color: var(--party-color, var(--accent)); border-width: 2px; box-shadow: 0 1px 6px var(--shadow); transition: all 0.2s ease; }
  .party-btn.active::before { opacity: 0.15; }
  .party-btn.active .letter { color: var(--party-color) !important; }
  .party-btn.active .name { color: var(--text); }

  /* Party colors */
  .party-B { --party-color: #4a8c3f; }
  .party-C { --party-color: #f5a623; }
  .party-D { --party-color: #2b4faa; }
  .party-F { --party-color: #e8508a; }
  .party-G { --party-color: #00897B; }
  .party-J { --party-color: #c0312b; }
  .party-M { --party-color: #008080; }
  .party-R { --party-color: #3aabcc; }
  .party-P { --party-color: #7b3fa0; }
  .party-S { --party-color: #e8251f; }
  .party-A { --party-color: #5a9e3a; }

  .result-panel {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .result-empty {
    text-align: center;
    color: var(--empty-text);
    font-size: 0.85rem;
    font-family: var(--sans);
  }
  .result-empty .arrow { font-size: 1.3rem; display: block; margin-bottom: 0.4rem; opacity: 0.4; }

  .coalition-label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.9rem;
    font-family: var(--sans);
    line-height: 1.5;
  }

  .coalition-tag {
    display: inline;
    font-weight: 700;
    font-size: 0.75rem;
  }

  .prob-display {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    margin-bottom: 0.25rem;
  }

  .prob-number {
    font-family: var(--mono);
    font-size: 4.5rem;
    font-weight: 700;
    line-height: 1;
    transition: color 0.3s ease;
  }

  .prob-unit {
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--muted);
    font-weight: 400;
  }

  .prob-label {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .bar-track {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 0.75rem;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1), background-color 0.3s ease;
  }

  .verdict {
    font-size: 0.72rem;
    font-family: var(--sans);
    font-weight: 600;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    display: inline-block;
    letter-spacing: 0.02em;
  }

  .verdict-high   { background: #dcfce7; color: #166534; }
  .verdict-medium { background: #fef9c3; color: #854d0e; }
  .verdict-low    { background: #fee2e2; color: #991b1b; }
  .verdict-none   { background: #f1f5f9; color: #64748b; }

  .trend-section {
    margin-top: 1.1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    position: relative;
  }

  .trend-label {
    font-size: 0.68rem;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .trend-chart {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .trend-axis-label {
    font-size: 0.58rem;
    fill: var(--muted, #9ca3af);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .trend-dot {
    transition: r 0.1s ease;
    cursor: crosshair;
  }

  .trend-hover-zone {
    cursor: crosshair;
  }

  .trend-tooltip, .dist-tooltip {
    position: absolute;
    background: var(--text);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 600;
    padding: 0.3rem 0.55rem;
    border-radius: 4px;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s ease;
    z-index: 10;
    transform: translate(-50%, -130%);
  }

  .trend-tooltip.visible, .dist-tooltip.visible {
    opacity: 1;
  }

  .trend-tooltip::after, .dist-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: var(--text);
  }

  .clear-btn {
    margin-top: 0.75rem;
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 0.4rem 0.9rem;
    text-transform: uppercase;
    transition: all 0.12s ease;
    display: block;
    margin-left: auto;
  }
  .clear-btn:hover { border-color: var(--muted); color: var(--text); background: var(--surface); }

  .footnote {
    margin-top: 0.9rem;
    font-size: 0.68rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  .output-section {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px 14px;
    margin-bottom: 14px;
    background: var(--surface);
  }
  .output-section:last-child { margin-bottom: 0; }
  .output-section-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  @media (prefers-color-scheme: light) {
    .output-section { background: #fafbfc; }
  }

  .dist-section {
    margin: 18px 0 4px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .dist-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 4px;
  }
  .dist-chart {
    width: 100%;
    overflow: visible;
  }
  .muted-bar { fill: var(--muted-bar, #ccc); }
</style>
</head>

</div>

// Party display order (determines coalition key sort order)
const ORDER = ['A','B','C','D','F','G','J','M','P','R','S'];

// Party brand colors
const PARTY_COLORS = {
  S:'#e8251f', D:'#2b4faa', C:'#f5a623', M:'#008080',
  A:'#5a9e3a', B:'#4a8c3f', P:'#7b3fa0', F:'#e8508a',
  J:'#c0312b', R:'#3aabcc', G:'#00897B'
};

let selected = new Set();

function toggle(p) {
  if (selected.has(p)) {
    selected.delete(p);
    document.querySelector(`[data-party="${p}"]`).classList.remove('active');
  } else {
    selected.add(p);
    document.querySelector(`[data-party="${p}"]`).classList.add('active');
  }
  render();
}

function clearAll() {
  selected.forEach(p => document.querySelector(`[data-party="${p}"]`).classList.remove('active'));
  selected.clear();
  render();
}

function getKey() {
  return ORDER.filter(p => selected.has(p)).join('');
}

function getColor(pct) {
  if (pct >= 55) return '#16a34a';
  if (pct >= 30) return '#d97706';
  if (pct >= 15) return '#dc2626';
  return '#6b7280';
}

function getVerdict(pct) {
  if (pct >= 95) return ['verdict-high',   'Nánast öruggt'];
  if (pct >= 70) return ['verdict-high',   'Mjög líklegt'];
  if (pct >= 55) return ['verdict-medium', 'Líklegt, meiri en helmings líkur'];
  if (pct >= 45) return ['verdict-medium', 'Vel mögulegt, um helmings líkur'];
  if (pct >= 30) return ['verdict-low',    'Mögulegt en minna en helmings líkur'];
  if (pct >= 15) return ['verdict-low',    'Ólíklegt'];
  return                ['verdict-none',   'Mjög ólíklegt'];
}

function render() {
  const panel = document.getElementById('resultPanel');
  if (selected.size === 0) {
    panel.innerHTML = `<div class="result-empty"><span class="arrow">↑</span>Veldu flokka hér að ofan</div>`;
    return;
  }

  const key = getKey();
  const val = DATA[key];

  if (val === undefined) {
    panel.innerHTML = `<div class="not-found"><span class="icon">⚠</span>Samsetning finnst ekki í gögnum</div>`;
    return;
  }

  const color = getColor(val);
  const [verdictClass, verdictText] = getVerdict(val);
  const selectedParties = ORDER.filter(p => selected.has(p));
  const tagsHtml = selectedParties.map((p, i, arr) =>
    `<span class="coalition-tag" style="color:${PARTY_COLORS[p]}">${p}</span>${i < arr.length-1 ? ' + ' : ''}`
  ).join('');
  const countNames = ['eins flokks', 'tveggja flokka', 'þriggja flokka', 'fjögurra flokka', 'fimm flokka', 'sex flokka', 'sjö flokka', 'átta flokka', 'níu flokka', 'tíu flokka'];
  const countLabel = countNames[selectedParties.length - 1] || `${selectedParties.length} flokka`;
  const coalitionLabel = `Samsetning: ${tagsHtml} — ${countLabel} samstarf`;

  const allSelected = selected.size === 10;
  const displayVal = allSelected ? '100' : val < 1 ? '<1' : val > 99 ? '>99' : Math.round(val);
  const [finalVerdictClass, finalVerdictText] = allSelected ? ['verdict-high', 'Öruggt'] : [verdictClass, verdictText];

  panel.innerHTML = `
    <div class="output-section">
      <div class="output-section-label">Staðan miðað við nýjustu kannanir</div>
      <div class="coalition-label">${coalitionLabel}</div>
      <div class="prob-display">
        <span class="prob-number" style="color:${color}">${displayVal}</span>
        <span class="prob-unit">%</span>
      </div>
      <div class="prob-label">líkur á 12 eða fleiri sætum í borgarstjórn (af 23)</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${allSelected ? 100 : val}%;background:${color}"></div>
      </div>
      <span class="verdict ${finalVerdictClass}">${finalVerdictText}</span>
      ${buildDistChart(key, color)}
      <div class="footnote">Byggt á fylgi flokka í kosningaspá 13. maí 2026</div>
    </div>
    <div class="output-section">
      ${buildTrendChart(key, color)}
    </div>
  `;
  wireTrendHover();
  wireDistHover();
}



function buildDistChart(key, color) {
  const vals = DIST_DATA[key];
  if (!vals) return '';

  // Find seat range with non-zero probability
  let minSeat = 23, maxSeat = 0;
  for (let i = 0; i <= 23; i++) {
    if (vals[i] > 0.01) { minSeat = Math.min(minSeat, i); maxSeat = Math.max(maxSeat, i); }
  }
  minSeat = Math.max(0, minSeat - 1);
  maxSeat = Math.min(23, maxSeat + 1);

  const seats = [];
  for (let i = minSeat; i <= maxSeat; i++) seats.push(i);
  const n = seats.length;

  // Color-coded title HTML: "A + C + D"
  const titleHtml = key.split('').map((p, i, arr) =>
    `<span style="color:${PARTY_COLORS[p]||'inherit'};font-weight:600">${p}</span>${i < arr.length-1 ? ' + ' : ''}`
  ).join('');

  // Dimensions
  const W = 340, H = 100;
  const padL = 36, padR = 8, padT = 10, padB = 32;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const rawMax = Math.max(...seats.map(s => vals[s]));

  // Y-axis: always from 0, round up to nice interval
  const interval = rawMax <= 30 ? 5 : 10;
  const yMax = Math.ceil(rawMax / interval) * interval;

  const xPos = i => padL + i * ((chartW / n));
  const barW = Math.max(1, chartW / n - 1);
  const yPos = v => padT + chartH * (1 - v / yMax);
  const barH = v => chartH * (v / yMax);

  // Grid lines + Y-axis labels at every interval from 0 to yMax
  let gridLines = '';
  let yLabels = '';
  for (let tick = 0; tick <= yMax; tick += interval) {
    const y = yPos(tick).toFixed(1);
    gridLines += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="${tick === 0 ? 1.5 : 1}" opacity="${tick === 0 ? 0.5 : 1}"/>`;
    yLabels += `<text x="${padL - 4}" y="${y}" text-anchor="end" dominant-baseline="middle" class="trend-axis-label">${tick}%</text>`;
  }

  // Y-axis title "líkur"
  const yAxisTitle = `<text x="${-(padT + chartH / 2)}" y="10" transform="rotate(-90)" text-anchor="middle" class="trend-axis-label">líkur</text>`;

  // Bars (visual only — hover handled by invisible zones below)
  let bars = '';
  seats.forEach((seat, i) => {
    const v = vals[seat];
    const x = xPos(i).toFixed(1);
    const bh = Math.max(0, barH(v));
    const by = (padT + chartH - bh).toFixed(1);
    const fillColor = seat >= 12 ? color : 'var(--muted-bar)';
    const opacity = v < 0.005 ? 0.2 : 1;
    bars += `<rect x="${x}" y="${by}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${fillColor}" opacity="${opacity}" rx="1"/>`;
  });

  // Majority divider line at seat 12
  let divider = '';
  const div12idx = seats.indexOf(12);
  if (div12idx > 0) {
    const dx = (xPos(div12idx) - (chartW / n - barW) / 2 - 0.5).toFixed(1);
    divider = `<line x1="${dx}" x2="${dx}" y1="${padT}" y2="${padT + chartH + 4}" stroke="var(--text)" stroke-width="1" stroke-dasharray="3,2" opacity="0.35"/>`;
  }

  // X-axis seat number labels
  let labels = '';
  const step = n > 16 ? 2 : 1;
  seats.forEach((seat, i) => {
    if ((seat % step === 0) || seat === 12) {
      const x = (xPos(i) + barW / 2).toFixed(1);
      const labelY = (padT + chartH + 12).toFixed(0);
      labels += `<text x="${x}" y="${labelY}" text-anchor="middle" class="trend-axis-label" ${seat >= 12 ? `fill="${color}"` : ''}>${seat}</text>`;
    }
  });

  // X-axis title
  const xAxisTitle = `<text x="${(padL + W - padR) / 2}" y="${H - 2}" text-anchor="middle" class="trend-axis-label">fjöldi sæta í borgarstjórn</text>`;

  // Invisible hover zones — one per bar, triggers dist-tip tooltip
  let hoverZones = '';
  seats.forEach((seat, i) => {
    const v = vals[seat];
    const x = xPos(i).toFixed(1);
    const cx = (xPos(i) + barW / 2).toFixed(1);
    const cy = yPos(v).toFixed(1);
    const dispVal = Math.round(v) + '%';
    hoverZones += `<rect x="${x}" y="${padT}" width="${(chartW / n).toFixed(1)}" height="${chartH + 4}" fill="transparent" class="dist-hover-zone" data-cx="${cx}" data-cy="${cy}" data-tip="${seat} sæti: ${dispVal}"/>`;
  });

  return `
    <div class="dist-section" style="position:relative">
      <div class="dist-label">Dreifing á fjölda sæta sem samstarf ${titleHtml} fær í hermunum</div>
      <div class="dist-tooltip" id="dist-tip"></div>
      <svg class="dist-chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        ${gridLines}
        ${yLabels}
        ${yAxisTitle}
        ${bars}
        ${divider}
        ${labels}
        ${xAxisTitle}
        ${hoverZones}
      </svg>
    </div>`;
}

function buildTrendChart(key, color) {
  const vals = TREND_DATA[key];
  if (!vals) return '';


  // Filter out NaN entries
  const pts = [];
  for (let i = 0; i < vals.length; i++) {
    if (vals[i] !== null && !isNaN(vals[i])) {
      pts.push({ dayOffset: DAY_OFFSETS[i], val: vals[i], info: DATE_INFO[i], idx: i });
    }
  }
  if (pts.length < 2) return '';

  const W = 340, H = 110;
  const padL = 32, padR = 8, padT = 10, padB = 28;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const firstDay = pts[0].dayOffset;
  const lastDay = pts[pts.length - 1].dayOffset;
  const dayRange = lastDay - firstDay;

  const xPos = d => padL + ((d.dayOffset - firstDay) / dayRange) * chartW;

  // Smart y-axis: always anchored at 0, top padded above max
  const maxVal = Math.max(...pts.map(d => d.val));
  let yMax, yTicks;
  if (maxVal <= 5)        { yMax = 5;   yTicks = [0, 1, 2, 3, 4, 5]; }
  else if (maxVal <= 10)  { yMax = 10;  yTicks = [0, 5, 10]; }
  else if (maxVal <= 20)  { yMax = 20;  yTicks = [0, 10, 20]; }
  else if (maxVal <= 35)  { yMax = 35;  yTicks = [0, 10, 20, 30]; }
  else if (maxVal <= 50)  { yMax = 50;  yTicks = [0, 25, 50]; }
  else if (maxVal <= 75)  { yMax = 75;  yTicks = [0, 25, 50, 75]; }
  else                    { yMax = 100; yTicks = [0, 25, 50, 75, 100]; }

  const yPos = v => padT + chartH - (Math.min(Math.max(v, 0), yMax) / yMax) * chartH;

  // Polyline + area
  const ptStr = pts.map(d => `${xPos(d).toFixed(1)},${yPos(d.val).toFixed(1)}`).join(' ');
  const first = pts[0], last = pts[pts.length - 1];
  const areaPath = `M${xPos(first).toFixed(1)},${(padT + chartH).toFixed(1)} ` +
    pts.map(d => `L${xPos(d).toFixed(1)},${yPos(d.val).toFixed(1)}`).join(' ') +
    ` L${xPos(last).toFixed(1)},${(padT + chartH).toFixed(1)} Z`;

  // Y-axis gridlines + labels
  const yAxisLines = yTicks.map(v => {
    const y = yPos(v).toFixed(1);
    const isZero = v === 0;
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="currentColor" stroke-opacity="${isZero ? 0.3 : 0.12}" stroke-width="${isZero ? 1 : 0.75}" stroke-dasharray="${isZero ? 'none' : '3,3'}"/>
    <text x="${(padL - 3).toFixed(1)}" y="${y}" dy="3.5" text-anchor="end" class="trend-axis-label">${v}%</text>`;
  }).join('');

  // X-axis: show labels for first, year-change point, last — with year context
  const xAxisLabels = [];
  const shownYears = new Set();
  // Always show first
  xAxisLabels.push({ pt: pts[0], anchor: 'start', forceShow: true });
  // Show year-change boundary (first point in 2026)
  const firstOf2026 = pts.find(p => p.info.year === 2026);
  if (firstOf2026 && firstOf2026 !== pts[0] && firstOf2026 !== pts[pts.length-1]) {
    xAxisLabels.push({ pt: firstOf2026, anchor: 'middle', forceShow: true });
  }
  // Always show last
  xAxisLabels.push({ pt: pts[pts.length - 1], anchor: 'end', forceShow: true });

  const xLabels = xAxisLabels.map(({ pt, anchor }) => {
    const yr = pt.info.year === 2025 ? '\'25' : '\'26';
    const monthMap = { okt: 'okt', nóv: 'nóv', des: 'des', jan: 'jan', feb: 'feb', mar: 'mar' };
    const month = pt.info.label.split(' ')[1];
    const label = `${month} ${yr}`;
    return `<text x="${xPos(pt).toFixed(1)}" y="${H - 4}" text-anchor="${anchor}" class="trend-axis-label">${label}</text>`;
  }).join('');

  // Year divider line at first 2026 point
  let yearDivider = '';
  if (firstOf2026 && pts[0].info.year === 2025) {
    const divX = xPos(firstOf2026).toFixed(1);
    const labelY = padT + chartH + 10;
    yearDivider = `<line x1="${divX}" y1="${padT}" x2="${divX}" y2="${padT + chartH}" stroke="currentColor" stroke-opacity="0.12" stroke-width="0.75" stroke-dasharray="2,2"/>`;
  }

  // Dots
  const dots = pts.map((d, i) => {
    const cx = xPos(d).toFixed(1);
    const cy = yPos(d.val).toFixed(1);
    const dispVal = d.val < 1 ? '<1%' : d.val > 99 ? '>99%' : Math.round(d.val) + '%';
    return `<circle class="trend-dot" cx="${cx}" cy="${cy}" r="3.5" fill="${color}" stroke="var(--bg)" stroke-width="2" data-tip="${d.info.label}: ${dispVal}"/>`;
  }).join('');

  // Invisible hover zones that trigger the tooltip
  const hoverZones = pts.map((d, i) => {
    const cx = xPos(d);
    const halfLeft = i === 0 ? chartW * 0.06 : (cx - xPos(pts[i-1])) / 2;
    const halfRight = i === pts.length - 1 ? chartW * 0.06 : (xPos(pts[i+1]) - cx) / 2;
    const rx = (cx - halfLeft).toFixed(1);
    const rw = (halfLeft + halfRight).toFixed(1);
    const dispVal = d.val < 1 ? '<1%' : d.val > 99 ? '>99%' : Math.round(d.val) + '%';
    const pct = (((cx - padL) / chartW) * 100).toFixed(1);
    return `<rect x="${rx}" y="${padT}" width="${rw}" height="${chartH + 4}" fill="transparent" class="trend-hover-zone"
      data-cx="${cx.toFixed(1)}" data-cy="${yPos(d.val).toFixed(1)}" data-tip="${d.info.label}: ${dispVal}" data-pct="${pct}"/>`;
  }).join('');

  return `
  <div class="trend-section" id="trend-wrap">
    <div class="trend-label">Þróun á líkum</div>
    <div class="trend-tooltip" id="trend-tip"></div>
    <svg class="trend-chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0.01"/>
        </linearGradient>
      </defs>
      ${yAxisLines}
      ${yearDivider}
      <path d="${areaPath}" fill="url(#tg)"/>
      <polyline points="${ptStr}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${hoverZones}
      ${xLabels}
    </svg>
  </div>`;
}
function showTip(el) {
  const tip = document.getElementById('trend-tip');
  if (!tip) return;
  const svg = el.closest('svg');
  const wrap = el.closest('.trend-section');
  const svgRect = svg.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;

  const dataCx = parseFloat(el.getAttribute('data-cx'));
  const dataCy = parseFloat(el.getAttribute('data-cy'));

  // Map SVG coords to pixel coords relative to wrap div
  const scaleX = svgRect.width / vb.width;
  const scaleY = svgRect.height / vb.height;
  const px = (svgRect.left - wrapRect.left) + dataCx * scaleX;
  const py = (svgRect.top - wrapRect.top) + dataCy * scaleY;

  tip.textContent = el.getAttribute('data-tip');
  tip.style.left = px + 'px';
  tip.style.top = py + 'px';
  tip.classList.add('visible');

  // Enlarge the nearest dot
  svg.querySelectorAll('.trend-dot').forEach(d => d.setAttribute('r', '3'));
  const nearDot = [...svg.querySelectorAll('.trend-dot')].find(d =>
    Math.abs(parseFloat(d.getAttribute('cx')) - dataCx) < 2
  );
  if (nearDot) nearDot.setAttribute('r', '5');
}

function hideTip() {
  const tip = document.getElementById('trend-tip');
  if (tip) tip.classList.remove('visible');
  document.querySelectorAll('.trend-dot').forEach(d => d.setAttribute('r', '3'));
}

// Wire up hover zones after render (called after panel.innerHTML is set)
function wireTrendHover() {
  document.querySelectorAll('.trend-hover-zone').forEach(function(el) {
    el.addEventListener('mouseenter', function() { showTip(el); });
    el.addEventListener('touchstart', function(e) { e.preventDefault(); showTip(el); }, { passive: false });
  });
  var svg = document.querySelector('.trend-chart');
  if (svg) svg.addEventListener('mouseleave', hideTip);
}

function wireDistHover() {
  const tip = document.getElementById('dist-tip');
  if (!tip) return;
  const svg = document.querySelector('.dist-chart');
  if (!svg) return;
  const wrap = svg.closest('.dist-section');

  document.querySelectorAll('.dist-hover-zone').forEach(function(el) {
    function showDistTip() {
      const svgRect = svg.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      const scaleX = svgRect.width / vb.width;
      const scaleY = svgRect.height / vb.height;
      const cx = parseFloat(el.getAttribute('data-cx'));
      const cy = parseFloat(el.getAttribute('data-cy'));
      const px = (svgRect.left - wrapRect.left) + cx * scaleX;
      const py = (svgRect.top - wrapRect.top) + cy * scaleY;
      tip.textContent = el.getAttribute('data-tip');
      tip.style.left = px + 'px';
      tip.style.top = py + 'px';
      tip.classList.add('visible');
    }
    el.addEventListener('mouseenter', showDistTip);
    el.addEventListener('touchstart', function(e) { e.preventDefault(); showDistTip(); }, { passive: false });
  });
  svg.addEventListener('mouseleave', function() { tip.classList.remove('visible'); });
}

// Use container-level delegation — more reliable than document-level in WordPress
var _grid = document.getElementById('partiesGrid');
if (_grid) {
  _grid.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-party]');
    if (btn) toggle(btn.getAttribute('data-party'));
  });
}
var _clear = document.querySelector('.clear-btn');
if (_clear) _clear.addEventListener('click', clearAll);

  // Auto-resize iframe height for parent page
  function reportHeight() {
    var h = document.body.scrollHeight;
    window.parent.postMessage({ borgHeight: h }, '*');
  }
  // Report on load and whenever content changes
  reportHeight();
  var _resizeObserver = new MutationObserver(reportHeight);
  _resizeObserver.observe(document.body, { childList: true, subtree: true, attributes: true });
  window.addEventListener('resize', reportHeight);

</script>
